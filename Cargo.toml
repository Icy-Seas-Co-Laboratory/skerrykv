[package]
name = "skerrykv"
version = "0.4.1"
edition = "2024"
rust-version = "1.90"
description = "Durable content-addressed binary object storage"
license = "MIT"

[[bin]]
name = "skerry"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
rmcp = { version = "3.8", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest", "transport-child-process"] }
async-stream = "0.3"
axum = "0.8"
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
crossterm = "0.29"
fjall = "3.1"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
parking_lot = "0.12"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
