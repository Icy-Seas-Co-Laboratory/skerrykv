# Paths are relative to this file. Tokens belong in SKERRY_TOKEN, never here.
[server]
listen = "127.0.0.1:7788"
# Optional dedicated monitoring/shutdown listener, for example:
# admin_listen = "127.0.0.1:7789"
request_timeout_seconds = 120
shutdown_timeout_seconds = 30

[storage]
root = "./data"
min_free_mib = 256 # Global minimum free-space reserve for writes/checkpoints.

[segments]
max_size_bytes = 8589934592
growth_factor = 1 # 2 enables geometric logical growth, not disk block reservation

[writes]
writer_lanes = 1 # Opt in to 2, 4, or 8 parallel append lanes; shared durable publication.
# Multi-lane publication coalesces ready work for at most this extra interval.
# Sparse/skewed multi-lane traffic may wait the full interval; one lane ignores it.
commit_max_delay_ms = 10
batch_max_records = 512
batch_max_delay_ms = 1
max_pending_mib = 256
batch_max_bytes_mib = 16 # Write aggregation target, not request admission capacity.

[reads]
policy = "ssd" # or "hdd"
max_concurrency = 32
hdd_window_ms = 4
queue_items = 1024

[resources]
max_object_mib = 64
max_inflight_read_mib = 256
max_open_segments = 256
max_requests = 128
max_batch_items = 4096
admission_timeout_ms = 5000
max_inflight_per_batch = 32
admin_max_requests = 8

[cache]
payload_mib = 256 # 0 disables payload caching
index_mib = 128
admission_entries = 65536
admission_window_seconds = 300
max_entries = 1000000 # Independent cap; metadata_mib can impose a lower effective count.
max_object_mib = 8 # Larger individual objects bypass the payload cache.
metadata_mib = 64 # Separate bound for cache indexes and admission history.
shards = 16 # Power of two; fixed per-shard budgets can leave capacity unused under skew.

[streaming]
enabled = true
threshold_mib = 8
max_object_mib = 4096
chunk_kib = 1024
max_uploads = 2
max_reads = 4
checksum_cache_mib = 16
transfer_timeout_seconds = 3600
idle_timeout_seconds = 30 # Maximum wait for a streamed GET consumer before releasing its resources.
min_free_mib = 256 # Effective write reserve is max(storage.min_free_mib, streaming.min_free_mib).

[checkpoint]
enabled = true
interval_seconds = 300
min_journal_mib = 256
max_catchup_mib = 16
max_tail_kib = 256
batch_records = 512

# Initial tunable maintenance defaults; automatic collection is opt-in.
[gc]
enabled = false
interval_seconds = 1800
min_garbage_ratio = 0.5
delete_grace_seconds = 86400
cooldown_seconds = 86400
max_copy_mib = 1024
max_bytes_per_second_mib = 25
low_space_percent = 20
target_free_percent = 30
min_free_mib = 256

[logging]
level = "info" # RUST_LOG overrides this

# MCP uses the same store/coordinators. Local anonymous access is read-only.
# Scoped secrets: SKERRY_MCP_READ_TOKEN / WRITE_TOKEN / MAINTENANCE_TOKEN.
[mcp]
enabled = true
http_path = "/mcp"
read_only = true
allow_verification = false
max_inline_object_kib = 128
max_put_object_kib = 128
max_list_page_size = 100
max_concurrent_requests = 16
max_encoded_response_kib = 512
max_response_memory_mib = 16
max_request_kib = 256
max_verification_jobs = 1
max_retained_jobs = 64
tool_timeout_seconds = 30
verification_timeout_seconds = 300
requests_per_minute = 120
auth_gateway = false
allowed_origins = [] # Empty rejects every present Origin; non-browser clients omit it.
# external_url = "https://mcp.example.com/mcp" # Requires compatible OAuth gateway.

# Shared limits for online and offline integrity scans.
[verification]
max_concurrency = 1 # Sequential by default to reduce HDD seek pressure.
max_bytes_per_second_mib = 0 # Zero means unlimited; applies to scan reads.
